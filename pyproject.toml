[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-newsletter"
version = "0.1.0"
description = "Daily tech-blog digest: collect, rank against interests, summarize, email"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
it-newsletter = "it_newsletter.cli.daily:main"
it-newsletter-scan = "it_newsletter.cli.scan:main"
it-newsletter-sites = "it_newsletter.cli.sites:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
it_newsletter = ["templates/*.html"]
